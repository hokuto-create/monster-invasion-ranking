<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔物襲来 全体ランキング</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="魔物ランキング">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&family=Exo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
.graph-tab{padding:16px;}
.graph-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end;}
.graph-ctrl-group{display:flex;flex-direction:column;gap:4px;}
.graph-ctrl-group label{font-size:10px;color:var(--muted);letter-spacing:1px;}
.graph-boss-chips{display:flex;gap:6px;flex-wrap:wrap;}
.boss-chip{flex-shrink:0;padding:4px 11px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:11px;border-radius:20px;cursor:pointer;transition:all 0.2s;font-family:'Noto Sans JP',sans-serif;}
.boss-chip:hover{border-color:var(--gold2);color:var(--gold);}
.boss-chip.active{border-color:var(--gold);background:rgba(240,192,64,0.1);color:var(--gold);font-weight:700;}
.clan-select-wrap{position:relative;flex:1;min-width:160px;}
.clan-search{width:100%;padding:7px 11px;background:var(--dark);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;outline:none;font-family:'Noto Sans JP',sans-serif;}
.clan-search:focus{border-color:var(--gold2);}
.clan-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--panel2);border:1px solid var(--border);border-radius:4px;max-height:200px;overflow-y:auto;z-index:50;display:none;}
.clan-dropdown.open{display:block;}
.clan-opt{padding:7px 11px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--border);}
.clan-opt:last-child{border-bottom:none;}
.clan-opt:hover{background:rgba(240,192,64,0.07);}
.selected-clans{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.clan-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:11px;border:1px solid;}
.clan-tag-del{background:none;border:none;cursor:pointer;font-size:12px;line-height:1;padding:0;opacity:0.6;}
.clan-tag-del:hover{opacity:1;}
.chart-wrap{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;}
.no-graph{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
.compare-table{width:100%;border-collapse:collapse;font-size:12px;}
.compare-table th{padding:8px 10px;background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);font-weight:400;text-align:center;font-size:10px;letter-spacing:1px;white-space:nowrap;}
.compare-table th.clan-th{text-align:left;max-width:100px;overflow:hidden;text-overflow:ellipsis;}
.compare-table td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle;}
.compare-table td.date-td{color:var(--muted);font-size:11px;white-space:nowrap;text-align:left;}
.compare-table tr:last-child td{border-bottom:none;}
.compare-table tr:hover td{background:rgba(255,255,255,0.02);}
.cmp-score{font-family:'Exo 2',sans-serif;font-weight:700;font-size:12px;color:var(--text);}
.cmp-rank{display:inline-block;font-family:'Exo 2',sans-serif;font-weight:800;font-size:11px;width:20px;height:20px;line-height:20px;border-radius:50%;text-align:center;margin-bottom:2px;}
.cmp-r1{background:linear-gradient(145deg,#fff5a0,#f0c030,#a06000);color:#3a1a00;}
.cmp-r2{background:linear-gradient(145deg,#ffffff,#d8e4f0,#7090b0);color:#101820;}
.cmp-r3{background:linear-gradient(145deg,#ffd090,#e08040,#7a3010);color:#2a0a00;}
.cmp-rx{background:var(--panel2);color:var(--muted);border:1px solid var(--border);}
.cmp-none{color:var(--muted);font-size:10px;}
.cmp-winner{background:rgba(240,192,64,0.06);}
:root{--gold:#f0c040;--gold2:#c8922a;--dark:#080a0f;--panel:#10141e;--panel2:#171d2a;--accent:#e84040;--blue:#4080e0;--text:#e8dcc8;--muted:#6a7080;--border:#222840;--green:#50c880;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 90% 50% at 50% -10%,rgba(180,70,10,0.15) 0%,transparent 65%),radial-gradient(ellipse 50% 40% at 90% 90%,rgba(64,128,224,0.07) 0%,transparent 55%),repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(255,255,255,0.015) 60px),repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(255,255,255,0.015) 60px);pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:20px 14px 80px;}
header{text-align:center;padding:28px 0 20px;}
.game-label{font-family:'Cinzel Decorative',serif;font-size:10px;letter-spacing:7px;color:var(--gold2);text-transform:uppercase;margin-bottom:6px;}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(20px,5.5vw,38px);font-weight:900;background:linear-gradient(135deg,#f8e080 0%,#f0c040 45%,#c8922a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;line-height:1.1;}
.subtitle{font-size:11px;color:var(--muted);letter-spacing:4px;margin-top:6px;}
.hdivider{width:200px;height:2px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);margin:14px auto 0;}
.date-bar{display:flex;gap:8px;overflow-x:auto;padding:16px 0 8px;scrollbar-width:none;margin-bottom:4px;}
.date-bar::-webkit-scrollbar{display:none;}
.date-chip{flex-shrink:0;padding:5px 13px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:12px;border-radius:20px;cursor:pointer;transition:all 0.2s;font-family:'Noto Sans JP',sans-serif;}
.date-chip:hover{border-color:var(--gold2);color:var(--gold);}
.date-chip.active{border-color:var(--gold);background:rgba(240,192,64,0.1);color:var(--gold);font-weight:700;}
.sv-bar{display:flex;gap:6px;padding-bottom:6px;scrollbar-width:none;margin-bottom:4px;flex-wrap:wrap;}
.sv-bar::-webkit-scrollbar{display:none;}
.sv-chip{flex-shrink:0;padding:4px 11px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:11px;border-radius:20px;cursor:pointer;transition:all 0.2s;font-family:'Noto Sans JP',sans-serif;}
.sv-chip:hover{border-color:var(--blue);color:#80b0f0;}
.sv-chip.active{border-color:#4080e0;background:rgba(64,128,224,0.15);color:#80b0f0;font-weight:700;}
.sv-chip.all{border-color:var(--gold2);}
.sv-chip.all.active{border-color:var(--gold);background:rgba(240,192,64,0.1);color:var(--gold);}
.sv-chip.no-data-sv{opacity:0.35;}
.ts-label{font-size:11px;color:var(--muted);text-align:right;margin-bottom:8px;}
.rank-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.rank-thead{display:grid;grid-template-columns:44px 80px 1fr 110px;padding:9px 16px;background:var(--panel2);border-bottom:1px solid var(--border);font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.rank-thead span:last-child{text-align:right;}
.rank-row{display:grid;grid-template-columns:44px 80px 1fr 110px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:center;transition:background 0.15s;animation:rIn 0.35s both;}
@keyframes rIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:none;}}
.rank-row:last-child{border-bottom:none;}
.rank-row:hover{background:rgba(255,255,255,0.025);}
.rank-row.top1{background:linear-gradient(90deg,rgba(240,180,0,0.08) 0%,rgba(240,180,0,0.04) 60%,transparent 100%);border-left:3px solid rgba(240,180,0,0.5);}
.rank-row.top2{background:linear-gradient(90deg,rgba(160,200,255,0.07) 0%,rgba(160,200,255,0.03) 60%,transparent 100%);border-left:3px solid rgba(160,200,255,0.35);}
.rank-row.top3{background:linear-gradient(90deg,rgba(220,120,40,0.07) 0%,rgba(220,120,40,0.03) 60%,transparent 100%);border-left:3px solid rgba(220,120,40,0.35);}
.badge{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-family:'Exo 2',sans-serif;font-weight:800;font-size:13px;}
.b1{background:linear-gradient(145deg,#fff5a0,#f0c030,#a06000);color:#3a1a00;font-size:16px;box-shadow:0 0 14px 4px rgba(240,180,0,0.55),0 0 4px 1px rgba(255,220,80,0.8);border:2px solid rgba(255,230,100,0.6);}
.b2{background:linear-gradient(145deg,#ffffff,#d8e4f0,#7090b0);color:#101820;font-size:15px;box-shadow:0 0 10px 3px rgba(160,200,255,0.35);border:2px solid rgba(200,220,255,0.5);}
.b3{background:linear-gradient(145deg,#ffd090,#e08040,#7a3010);color:#2a0a00;font-size:15px;box-shadow:0 0 10px 3px rgba(220,120,40,0.4);border:2px solid rgba(255,160,80,0.4);}
.bx{background:var(--panel2);color:var(--muted);border:1px solid var(--border);font-size:11px;width:32px;height:32px;}
.server-tag{display:inline-block;padding:3px 5px;border-radius:4px;text-align:center;font-size:9px;background:rgba(64,128,224,0.15);color:#80b0f0;border:1px solid rgba(64,128,224,0.25);line-height:1.5;word-break:keep-all;}
.clan-nm{font-size:16px;font-weight:700;cursor:pointer;}
.clan-nm:hover{text-decoration:underline;opacity:0.85;}
.clan-nm-r1{font-size:18px;}
.clan-nm-top{font-size:17px;font-weight:700;}
.score-cell{text-align:right;}
.score-val{font-family:'Exo 2',sans-serif;font-size:17px;font-weight:800;background:linear-gradient(135deg,#f0d080,#c8922a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px;}
.r1 .score-val{font-size:21px;}
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.loading{text-align:center;padding:48px 20px;color:var(--muted);font-size:13px;}
.admin-btn-wrap{text-align:right;margin-top:20px;}
.admin-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:11px;letter-spacing:2px;padding:6px 14px;border-radius:4px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.admin-btn:hover{border-color:var(--accent);color:var(--accent);}
.admin-panel{background:var(--panel);border:1px solid var(--accent);border-radius:10px;margin-top:10px;overflow:hidden;display:none;}
.admin-panel.open{display:block;}
.a-hdr{background:rgba(232,64,64,0.1);border-bottom:1px solid rgba(232,64,64,0.25);padding:11px 18px;font-size:10px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;}
.logout-btn{background:none;border:1px solid rgba(232,64,64,0.3);color:var(--accent);font-size:10px;padding:4px 10px;border-radius:3px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.login-box{padding:24px 20px;}
.login-box label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;}
.fi{width:100%;padding:9px 13px;background:var(--dark);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:14px;outline:none;font-family:'Noto Sans JP',sans-serif;margin-bottom:12px;}
.fi:focus{border-color:var(--gold2);}
.btn{padding:9px 22px;border:none;border-radius:4px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.btn-g{background:linear-gradient(135deg,#c8922a,#e0b030);color:#1a0e00;}
.err{color:var(--accent);font-size:12px;margin-bottom:10px;}
.ok{color:var(--green);font-size:12px;}
.a-tabs{display:flex;gap:4px;padding:14px 18px 0;border-bottom:1px solid var(--border);}
.a-tab{padding:7px 14px;font-size:11px;letter-spacing:2px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.2s;background:none;border-top:none;border-left:none;border-right:none;font-family:'Noto Sans JP',sans-serif;}
.a-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.manual-form{padding:16px 18px;}
.mf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px;}
.fg label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
.fg input,.fg select{width:100%;padding:8px 11px;background:var(--dark);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:13px;outline:none;font-family:'Noto Sans JP',sans-serif;}
.data-mgmt{padding:16px 18px;}
.dm-filter{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.dm-filter input,.dm-filter select{padding:6px 10px;background:var(--dark);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;outline:none;font-family:'Noto Sans JP',sans-serif;}
.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table th{padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);font-weight:400;text-align:left;}
.data-table td{padding:7px 10px;border-bottom:1px solid var(--border);}
.data-table tr:last-child td{border-bottom:none;}
.td-score{font-family:'Exo 2',sans-serif;color:var(--gold);font-size:13px;font-weight:700;}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;}
.del-btn:hover{color:var(--accent);}
.no-data{text-align:center;padding:24px;color:var(--muted);font-size:12px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:100%;max-width:480px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:15px;font-weight:700;color:var(--gold);}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;}
.modal-body{overflow-y:auto;padding:12px 18px 18px;}
.modal-row{display:grid;grid-template-columns:90px 44px 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.modal-row:last-child{border-bottom:none;}
.modal-date{color:var(--muted);font-size:12px;}
.modal-rank{font-family:'Exo 2',sans-serif;font-weight:800;text-align:center;}
.modal-rank.r1{color:var(--gold);}
.modal-rank.r2{color:#b0c8e8;}
.modal-rank.r3{color:#e08040;}
.modal-rank.rx{color:var(--muted);}
.modal-score{font-family:'Exo 2',sans-serif;font-weight:700;color:var(--gold);text-align:right;}
.ts-form{padding:16px 18px;}
.ts-grid{display:grid;gap:8px;}
.ts-row{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;}
.ts-row label{font-size:11px;color:var(--muted);}
.ts-row input{padding:6px 10px;background:var(--dark);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;outline:none;font-family:'Noto Sans JP',sans-serif;}
/* JSON import */
.json-import{padding:16px 18px;}
.json-import textarea{width:100%;height:120px;padding:10px;background:var(--dark);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;outline:none;font-family:monospace;resize:vertical;margin-bottom:10px;}
.json-import textarea:focus{border-color:var(--gold2);}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div id="clanModal" class="modal-bg" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hdr">
      <div><div class="modal-title" id="modalTitle"></div><div id="modalSubtitle" style="font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:1px;"></div></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="wrap">
<header>
  <div class="game-label">Archero 2</div>
  <h1>魔物襲来</h1>
  <div class="subtitle">JAPANESE SERVER RANKING</div>
  <div class="hdivider"></div>
</header>
<div style="display:flex;gap:8px;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:0;align-items:center;">
  <button class="a-tab active" id="navRanking" onclick="switchNav('ranking')" style="font-size:13px;padding:8px 16px;">🏆 ランキング</button>
  <button class="a-tab" id="navGraph" onclick="switchNav('graph')" style="font-size:13px;padding:8px 16px;">📈 グラフ</button>
  <button class="notif-btn" id="notifBtn" onclick="toggleNotif()" style="display:none;margin-left:auto;background:rgba(240,192,64,0.06);border:1px solid var(--gold2);color:var(--gold);font-size:11px;padding:6px 12px;border-radius:20px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;">🔔 更新通知</button>
</div>
<div id="rankingView">
<div class="date-bar" id="dateBar"></div>
<div class="sv-bar" id="svBar"></div>
<div class="ts-label" id="tsLabel"></div>
<div class="rank-panel">
  <div class="rank-thead">
    <span>順位</span><span>SV帯</span><span>クラン名</span><span>スコア</span>
  </div>
  <div id="rankBody"><div class="loading">⏳ データ読み込み中...</div></div>
</div>
<div class="admin-btn-wrap">
  <button class="admin-btn" onclick="toggleAdmin()">⚙ 管理者</button>
</div>
<div class="admin-panel" id="adminPanel">
  <div class="a-hdr">
    <span>管理者パネル</span>
    <button class="logout-btn" id="logoutBtn" style="display:none" onclick="doLogout()">ログアウト</button>
  </div>
  <div id="loginBox" class="login-box">
    <label>パスワード</label>
    <input class="fi" type="password" id="pwInput" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err" id="loginErr" style="display:none">パスワードが違います</div>
    <button class="btn btn-g" onclick="doLogin()">ログイン</button>
  </div>
  <div id="adminBody" style="display:none">
    <div class="a-tabs">
      <button class="a-tab active" id="atab0" onclick="switchATab(0)">✏️ 手動登録</button>
      <button class="a-tab" id="atab1" onclick="switchATab(1)">🕐 更新時刻</button>
      <button class="a-tab" id="atab2" onclick="switchATab(2)">🗂 データ管理</button>
    </div>
    <div id="aPane0" class="manual-form">
      <div class="mf-grid">
        <div class="fg"><label>日付</label><input type="date" id="mDate"></div>
        <div class="fg"><label>SV帯</label>
          <select id="mServer">
            <option value="1-10">1-10</option><option value="11-30">11-30</option><option value="31-50">31-50</option>
            <option value="51-80">51-80</option><option value="81-100">81-100</option>
            <option value="101-110 & 121-130">101-110 &amp; 121-130</option>
            <option value="111-120 & 131-140">111-120 &amp; 131-140</option>
            <option value="141-160">141-160</option><option value="161-186">161-186</option>
          </select>
        </div>
        <div class="fg"><label>クラン名</label><input type="text" id="mClan" placeholder="クラン名"></div>
        <div class="fg"><label>スコア（例: 1.23T）</label><input type="text" id="mScore" placeholder="1.23T / 45.6B"></div>
      </div>
      <button class="btn btn-g" onclick="manualAdd()">登録</button>
      <span class="ok" id="manualOk" style="display:none">✓ 登録しました</span>
    </div>
    <div id="aPane1" class="ts-form" style="display:none">
      <p style="font-size:11px;color:var(--muted);margin-bottom:12px;">各日付の更新時刻を設定します</p>
      <div class="ts-grid" id="tsGrid"></div>
      <br><button class="btn btn-g" onclick="saveTsEdits()">保存</button>
      <span class="ok" id="tsOk" style="display:none">✓ 保存しました</span>
    </div>
    <div id="aPane2" class="data-mgmt" style="display:none">
      <div class="dm-filter">
        <input type="date" id="filterDate" oninput="renderDataTable()">
        <select id="filterServer" onchange="renderDataTable()">
          <option value="">全SV帯</option>
          <option value="1-10">1-10</option><option value="11-30">11-30</option><option value="31-50">31-50</option>
          <option value="51-80">51-80</option><option value="81-100">81-100</option>
          <option value="101-110 & 121-130">101-110 &amp; 121-130</option>
          <option value="111-120 & 131-140">111-120 &amp; 131-140</option>

<script>
const ADMIN_PW = 'jp_ranking';
const ALL_SVS = ['1-10','11-30','31-50','51-80','81-100','101-110 & 121-130','111-120 & 131-140','141-160','161-186'];
const CLAN_ALIASES = {
  "X͓̽ˣLiภk̶": ["IvyLink"],
  "Neoすんすん": ["NeoCore"],
  "Neo焼肉屋": ["Neoすんすん", "NeoCore"],
  "Neoリーダー": ["Neo焼肉屋", "Neoすんすん", "NeoCore"],
  "Neo刑事": ["Neoリーダー", "Neo焼肉屋", "Neoすんすん", "NeoCore"],
  "Neoユースケ": ["Neo刑事", "Neoリーダー", "Neo焼肉屋", "Neoすんすん", "NeoCore"],
  "んふぉぉCore": ["NeoCore", "Neoユースケ", "Neo刑事", "Neoリーダー", "Neo焼肉屋", "Neoすんすん"],
  "Neoイルカ": ["んふぉぉCore", "NeoCore", "Neoユースケ", "Neo刑事", "Neoリーダー", "Neo焼肉屋", "Neoすんすん"],
  "Neoメンティ": ["NeoCore", "Neoイルカ", "んふぉぉCore", "Neoユースケ", "Neo刑事", "Neoリーダー", "Neo焼肉屋", "Neoすんすん"],
  "DRΛCore": ["NeoCore", "Neoメンティ", "Neoイルカ", "んふぉぉCore", "Neoユースケ", "Neo刑事", "Neoリーダー", "Neo焼肉屋", "Neoすんすん"],
  "DRiCE": ["DRΛCE"],
  "L͓̽ieภRocks": ["L͓̽ieภ絆"],
  "焼鳥クラン": ["焼鳥食べ隊"],
  "万鬼一華": ["砂鬼一家", "万紫千紅"],
  "絆ঌ暁": ["絆〆OrionShip"],
  "絆ঌ朧": ["絆〆UnionShip"],
  "双捷MythZENITH": ["双進ṀythȺres"],
  "ねねこねこ教": ["ねこねこねこ", "のの教"],
  "劇団おねえ": ["劇団オネエ", "BodyFeelsExit"],
  "劇団オネエღ": ["劇団おねえ", "劇団オネエ", "BodyFeelsExit"],
  "FeasTribaL": ["XenoTribaL", "宴Joy"],
  "夜桜七舞": ["夜桜ノ舞"],
  "マRA男Dの集い": ["男Dの集い"],
  "FCやまだ": ["やまだ家"],
  "やまだ屋": ["FCやまだ", "やまだ家"],
  "やまだ豕": ["やまだ家", "やまだ屋", "FCやまだ"],
  "貧乏人王国": ["貧乏人Family"]
};
const PARTIAL_DATES = {"2026-04-25":["101-110 & 121-130","161-186"]};

let entries = [];
let timestamps = {};
let selectedDate = null;
let selectedSv = 'all';
const tsEdits = {};

// ===== data.json読み込み =====
async function init() {
  document.getElementById('rankBody').innerHTML = '<div class="loading">⏳ データ読み込み中...</div>';
  try {
    const res = await fetch('./data.json?t=' + Date.now());
    const json = await res.json();
    entries = json.entries || [];
    timestamps = json.timestamps || {};
  } catch(e) {
    console.warn('data.json読み込み失敗:', e);
    entries = [];
  }
  document.getElementById('mDate').value = new Date().toISOString().slice(0,10);
  renderAll();
}
init();

function save(){
  // ローカル保存は使わない（data.jsonが正）
}

// ===== イベント委譲 =====
document.addEventListener('click', function(e){
  const dateBtn = e.target.closest('[data-date]');
  if(dateBtn){ selDate(dateBtn.getAttribute('data-date')); return; }
  const svBtn = e.target.closest('[data-sv]');
  if(svBtn){ selSv(svBtn.getAttribute('data-sv')); return; }
  const clanEl = e.target.closest('[data-clan]');
  if(clanEl){ openClanModal(clanEl.getAttribute('data-clan')); return; }
});

function getDates(){ return [...new Set(entries.map(e=>e.date))].sort((a,b)=>b.localeCompare(a)); }
function renderAll(){ renderDateBar(); renderSvBar(); renderRanking(); updateTsLabel(); }

function renderDateBar(){
  const dates=getDates(), bar=document.getElementById('dateBar');
  if(!dates.length){bar.innerHTML='';return;}
  if(!selectedDate||!dates.includes(selectedDate)) selectedDate=dates[0];
  bar.innerHTML = dates.map(d=>`<button class="date-chip${d===selectedDate?' active':''}" data-date="${d}" style="line-height:1.3;padding:5px 13px;">${fmtD(d)}</button>`).join('');
}
function fmtD(iso){
  const[y,m,d]=iso.split('-');
  const days=['日','月','火','水','木','金','土'];
  const bosses=['鎌の魔道士','墓守り','ファイアドラゴン','バルログ','メドゥーサ','ストーンマン','一つ目の魔道士'];
  const dow=new Date(+y,+m-1,+d).getDay();
  return `${+m}/${+d}(${days[dow]})<br><span style="font-size:9px;opacity:0.7;">${bosses[dow]}</span>`;
}
function selDate(d){ selectedDate=d; renderAll(); }

function renderSvBar(){
  const bar=document.getElementById('svBar');
  if(!selectedDate){bar.innerHTML='';return;}
  const dateSvs=new Set(entries.filter(e=>e.date===selectedDate).map(e=>e.server));
  const partial=PARTIAL_DATES[selectedDate]||[];
  if(selectedSv!=='all'&&!dateSvs.has(selectedSv)) selectedSv='all';
  const row1=['1-10','11-30','31-50','51-80','81-100'];
  const row2=['101-110 & 121-130','111-120 & 131-140','141-160','161-186'];
  let html='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">';
  html+=`<button class="sv-chip all${selectedSv==='all'?' active':''}" data-sv="all">全体</button>`;
  row1.forEach(s=>{
    const noData=!dateSvs.has(s);
    html+=`<button class="sv-chip${selectedSv===s?' active':''}${noData?' no-data-sv':''}" data-sv="${s}">${s}</button>`;
  });
  html+='</div><div style="display:flex;gap:6px;flex-wrap:wrap;">';
  row2.forEach(s=>{
    const noData=!dateSvs.has(s);
    const isPartial=partial.includes(s);
    html+=`<button class="sv-chip${selectedSv===s?' active':''}${noData?' no-data-sv':''}" data-sv="${s}">${s}${isPartial?' ⚠':''}</button>`;
  });
  html+='</div>';
  bar.innerHTML=html;
}
function selSv(sv){ selectedSv=sv; renderSvBar(); renderRanking(); updateTsLabel(); }

function updateTsLabel(){
  const el=document.getElementById('tsLabel');
  const ts=timestamps[selectedDate];
  el.textContent=ts?'🕐 '+ts:'';
}

function renderRanking(){
  const body=document.getElementById('rankBody');
  if(!selectedDate){body.innerHTML='<div class="empty">日付を選択してください</div>';return;}
  const partial=PARTIAL_DATES[selectedDate]||[];
  if(selectedSv==='all'){
    const presentSvs=new Set(entries.filter(e=>e.date===selectedDate).map(e=>e.server));
    const missingSvs=ALL_SVS.filter(s=>!presentSvs.has(s));
    if(missingSvs.length>0){
      body.innerHTML='<div class="empty"><div style="font-size:32px;opacity:.5;margin-bottom:12px">⚠️</div><div style="color:var(--gold);font-size:13px;margin-bottom:8px">一部未集計のため<br>全体ランキングは表示できません</div><div style="font-size:11px;color:var(--muted)">未集計：'+missingSvs.join('、')+'</div></div>';
      return;
    }
  }
  const day=entries.filter(e=>e.date===selectedDate&&(selectedSv==='all'||e.server===selectedSv)).sort((a,b)=>b.score-a.score);
  if(!day.length){body.innerHTML='<div class="empty">データがありません</div>';return;}
  body.innerHTML='';
  day.forEach((e,i)=>{
    const r=i+1;
    const bc=r===1?'b1':r===2?'b2':r===3?'b3':'bx';
    const topCls=r===1?'top1':r===2?'top2':r===3?'top3':'';
    const row=document.createElement('div');
    row.className=`rank-row ${r===1?'r1':''} ${topCls}`;
    row.style.animationDelay=`${i*0.04}s`;
    row.innerHTML=`<div><div class="badge ${bc}">${r}</div></div><div><span class="server-tag">${formatServer(e.server)}</span></div><div><div class="clan-nm ${r===1?'clan-nm-r1':r<=3?'clan-nm-top':''}" data-clan="${esc(e.clan)}">${esc(e.clan)}</div></div><div class="score-cell"><div class="score-val">${formatScore(e.score)}</div></div>`;
    body.appendChild(row);
  });
}

function formatServer(s){ return (s||'?').replace(' & ','<br>& '); }
function formatScore(n){
  n=Number(n);
  if(n>=1e15) return (n/1e15).toFixed(2)+'E';
  if(n>=1e12) return (n/1e12).toFixed(2)+'T';
  if(n>=1e9)  return (n/1e9).toFixed(2)+'B';
  if(n>=1e6)  return (n/1e6).toFixed(2)+'M';
  if(n>=1e3)  return (n/1e3).toFixed(2)+'K';
  return String(n);
}
function parseScore(s){
  s=String(s).replace(/,/g,'').trim();
  const m=s.match(/^([\d.]+)\s*([TBMKtbmk]?)$/);
  if(!m) return NaN;
  const v=parseFloat(m[1]),u=m[2].toUpperCase();
  if(u==='T') return Math.round(v*1e12);
  if(u==='B') return Math.round(v*1e9);
  if(u==='M') return Math.round(v*1e6);
  if(u==='K') return Math.round(v*1e3);
  return Math.round(v);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function toggleAdmin(){ document.getElementById('adminPanel').classList.toggle('open'); }
function doLogin(){
  if(document.getElementById('pwInput').value===ADMIN_PW){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminBody').style.display='block';
    document.getElementById('logoutBtn').style.display='inline-block';
    document.getElementById('loginErr').style.display='none';
    renderDataTable(); renderTsGrid();
  } else { document.getElementById('loginErr').style.display='block'; }
}
function doLogout(){
  document.getElementById('loginBox').style.display='block';
  document.getElementById('adminBody').style.display='none';
  document.getElementById('logoutBtn').style.display='none';
  document.getElementById('pwInput').value='';
}
function switchATab(n){
  [0,1,2].forEach(i=>{
    document.getElementById('aPane'+i).style.display=i===n?'block':'none';
    document.getElementById('atab'+i).classList.toggle('active',i===n);
  });
  if(n===2) renderDataTable();
  if(n===1) renderTsGrid();
}
function manualAdd(){
  const date=document.getElementById('mDate').value;
  const server=document.getElementById('mServer').value;
  const clan=document.getElementById('mClan').value.trim();
  const scoreRaw=document.getElementById('mScore').value.trim();
  const score=parseScore(scoreRaw);
  if(!date||!clan||isNaN(score)||score<=0){alert('入力内容を確認してください');return;}
  entries=entries.filter(e=>!(e.date===date&&e.server===server&&e.clan===clan));
  entries.push({date,server,clan,score});
  renderAll();
  document.getElementById('mClan').value=''; document.getElementById('mScore').value='';
  const ok=document.getElementById('manualOk'); ok.style.display='inline';
  setTimeout(()=>ok.style.display='none',2000);
}
function renderTsGrid(){
  const dates=getDates().slice().reverse();
  document.getElementById('tsGrid').innerHTML=dates.map(d=>
    `<div class="ts-row"><label>${fmtD(d)}</label><input type="text" value="${timestamps[d]||''}" onchange="tsEdits['${d}']=this.value" placeholder="例: 4/28 09:20更新"></div>`
  ).join('');
}
function saveTsEdits(){
  Object.assign(timestamps,tsEdits);
  const ok=document.getElementById('tsOk'); ok.style.display='inline';
  setTimeout(()=>ok.style.display='none',2000);
  updateTsLabel();
}
function renderDataTable(){
  const ft=document.getElementById('filterText').value.toLowerCase();
  const fd=document.getElementById('filterDate').value;
  const fs=document.getElementById('filterServer').value;
  const filtered=entries.filter(e=>(!ft||e.clan.toLowerCase().includes(ft))&&(!fd||e.date===fd)&&(!fs||e.server===fs)).sort((a,b)=>b.date.localeCompare(a.date)||b.score-a.score);
  const body=document.getElementById('dataBody');
  if(!filtered.length){body.innerHTML='<tr><td colspan="5" class="no-data">データがありません</td></tr>';return;}
  body.innerHTML=filtered.map((e,i)=>`<tr><td>${e.date}</td><td>${esc(e.server)}</td><td>${esc(e.clan)}</td><td class="td-score">${formatScore(e.score)}</td><td><button class="del-btn" onclick="delEntry(${entries.indexOf(e)})">✕</button></td></tr>`).join('');
}
function delEntry(i){ if(!confirm('削除しますか？'))return; entries.splice(i,1); renderAll(); renderDataTable(); }
function clearAllData(){ if(!confirm('全データを削除しますか？'))return; entries=[]; selectedDate=null; renderAll(); renderDataTable(); }

function getClanAliases(clanName){
  const aliases = CLAN_ALIASES[clanName] || [];
  Object.entries(CLAN_ALIASES).forEach(([newName, oldNames])=>{
    if(oldNames.includes(clanName) && !aliases.includes(newName)) aliases.push(newName);
  });
  return aliases;
}
function getClanNames(clanName){
  const all = new Set([clanName]);
  getClanAliases(clanName).forEach(a=>all.add(a));
  return [...all];
}

function openClanModal(clan){
  const txt=document.createElement('textarea'); txt.innerHTML=clan; const clanName=txt.value;
  const isAll=selectedSv==='all';
  const allNames=getClanNames(clanName);
  const clanServer=entries.find(e=>allNames.includes(e.clan))?.server||'';
  const aliases=getClanAliases(clanName);
  let aliasHtml='';
  if(aliases.length>0) aliasHtml=`<div style="font-size:10px;color:var(--muted);margin-top:3px;">旧名: ${aliases.join(' / ')}</div>`;
  document.getElementById('modalTitle').innerHTML=clanName+`<span style="font-size:9px;color:#80b0f0;background:rgba(64,128,224,0.15);border:1px solid rgba(64,128,224,0.25);border-radius:3px;padding:1px 5px;margin-left:7px;vertical-align:middle;line-height:1;display:inline-flex;align-items:center;">${clanServer}</span>`;
  document.getElementById('modalSubtitle').innerHTML=`${isAll?'全体順位':`SV${selectedSv}内順位`}${aliasHtml}`;
  const body=document.getElementById('modalBody'); body.innerHTML='';
  const allDates=[...new Set(entries.map(e=>e.date))].sort((a,b)=>b.localeCompare(a));
  allDates.forEach(date=>{
    const recs=allNames.map(name=>{
      const r=entries.find(e=>e.clan===name&&e.date===date);
      return r?{...r,usedName:name}:null;
    }).filter(Boolean);
    if(recs.length===0){
      const row=document.createElement('div'); row.className='modal-row';
      const svHasData=entries.filter(e=>e.date===date&&e.server===clanServer).length>0;
      const label=svHasData?'圏外':'未集計';
      const labelStyle=svHasData?'':'color:var(--muted);';
      row.innerHTML=`<div class="modal-date">${fmtD(date)}</div><div class="modal-rank rx" style="font-size:10px;${labelStyle}">${label}</div><div class="modal-score" style="color:var(--muted);font-size:12px;">-</div>`;
      body.appendChild(row);
    } else {
      recs.forEach((rec,ri)=>{
        const row=document.createElement('div'); row.className='modal-row';
        if(isAll){
          const presentSvs=new Set(entries.filter(e=>e.date===date).map(e=>e.server));
          const hasPartial=ALL_SVS.some(s=>!presentSvs.has(s));
          if(hasPartial){
            const nameTag=rec.usedName!==clanName?`<br><span style="font-size:9px;color:var(--muted);">${rec.usedName}</span>`:'';
            row.innerHTML=`<div class="modal-date">${ri===0?fmtD(date):''}</div><div class="modal-rank rx" style="font-size:10px;color:var(--muted);">未集計</div><div class="modal-score">${formatScore(rec.score)}${nameTag}</div>`;
            body.appendChild(row); return;
          }
        }
        const recServer=rec.server||clanServer;
        const pool=isAll
          ?entries.filter(e=>e.date===date).sort((a,b)=>b.score-a.score)
          :entries.filter(e=>e.date===date&&e.server===recServer).sort((a,b)=>b.score-a.score);
        const rank=pool.findIndex(e=>e.clan===rec.clan)+1;
        const rc=rank===1?'r1':rank===2?'r2':rank===3?'r3':'rx';
        const nameTag=rec.usedName!==clanName?`<br><span style="font-size:9px;color:var(--muted);">${rec.usedName}</span>`:'';
        row.innerHTML=`<div class="modal-date">${ri===0?fmtD(date):''}</div><div class="modal-rank ${rc}">${rank}</div><div class="modal-score">${formatScore(rec.score)}${nameTag}</div>`;
        body.appendChild(row);
      });
    }
  });
  document.getElementById('clanModal').style.display='flex';
}
function closeModal(){ document.getElementById('clanModal').style.display='none'; }

function switchNav(tab){
  const isRanking=tab==='ranking';
  document.getElementById('rankingView').style.display=isRanking?'block':'none';
  document.getElementById('graphView').style.display=isRanking?'none':'block';
  document.getElementById('navRanking').classList.toggle('active',isRanking);
  document.getElementById('navGraph').classList.toggle('active',!isRanking);
  if(!isRanking) initGraph();
}

// ===== GRAPH =====
const BOSSES=['墓守り','ファイアドラゴン','バルログ','メドゥーサ','ストーンマン','一つ目の魔道士','鎌の魔道士'];
const DOW_TO_BOSS={1:'墓守り',2:'ファイアドラゴン',3:'バルログ',4:'メドゥーサ',5:'ストーンマン',6:'一つ目の魔道士',0:'鎌の魔道士'};
let selectedBoss=null, selectedGraphClans=[], myChart=null;
const CLAN_COLORS=['#f0c040','#4080e0','#50c880','#e84040','#c050e0','#e08040','#40c0e0','#e0c040','#80e040','#e040a0'];

function initGraph(){ renderBossChips(); renderClanDropdown(); renderSelectedClans(); updateChart(); }
function renderBossChips(){
  document.getElementById('bossChips').innerHTML=BOSSES.map(b=>
    `<button class="boss-chip${b===selectedBoss?' active':''}" onclick="selectBoss('${b}')">${b}</button>`
  ).join('');
}
function selectBoss(b){ selectedBoss=b; renderBossChips(); updateChart(); }
function getBossDates(boss){
  const entry=Object.entries(DOW_TO_BOSS).find(([k,v])=>v===boss);
  if(!entry) return [];
  const dow=parseInt(entry[0]);
  return [...new Set(entries.map(e=>e.date))].filter(d=>{
    const[y,m,dd]=d.split('-');
    return new Date(+y,+m-1,+dd).getDay()===dow;
  }).sort();
}
function filterClanDropdown(){ renderClanDropdown(); openClanDropdown(); }
function openClanDropdown(){ document.getElementById('clanDropdown').classList.add('open'); renderClanDropdown(); }
function closeClanDropdown(){ document.getElementById('clanDropdown').classList.remove('open'); }
function renderClanDropdown(){
  const q=document.getElementById('clanSearch').value.toLowerCase();
  const allClans=[...new Set(entries.map(e=>e.clan))].filter(c=>!selectedGraphClans.includes(c)&&(!q||c.toLowerCase().includes(q))).sort();
  const dd=document.getElementById('clanDropdown');
  if(!allClans.length){dd.innerHTML='<div class="clan-opt" style="color:var(--muted)">見つかりません</div>';return;}
  dd.innerHTML=allClans.slice(0,30).map(c=>`<div class="clan-opt" onclick="addGraphClan('${esc(c)}')">${esc(c)}</div>`).join('');
}
function addGraphClan(clan){
  const txt=document.createElement('textarea');txt.innerHTML=clan;const name=txt.value;
  if(!selectedGraphClans.includes(name)) selectedGraphClans.push(name);
  document.getElementById('clanSearch').value=''; closeClanDropdown(); renderSelectedClans(); updateChart();
}
function removeGraphClan(clan){ selectedGraphClans=selectedGraphClans.filter(c=>c!==clan); renderSelectedClans(); updateChart(); }
function renderSelectedClans(){
  document.getElementById('selectedClans').innerHTML=selectedGraphClans.map((c,i)=>{
    const col=CLAN_COLORS[i%CLAN_COLORS.length];
    return `<span class="clan-tag" style="color:${col};border-color:${col};background:${col}20;">${esc(c)}<button class="clan-tag-del" style="color:${col};" onclick="removeGraphClan('${esc(c)}')">×</button></span>`;
  }).join('');
}

let selectedGraphClans2=[];
function switchGTab(n){
  [0,1].forEach(i=>{
    document.getElementById('gPane'+i).style.display=i===n?'block':'none';
    document.getElementById('gTab'+i).classList.toggle('active',i===n);
  });
  if(n===1){ renderSelectedClans2(); updateCompareTable(); }
}
function filterClanDropdown2(){ renderClanDropdown2(); openClanDropdown2(); }
function openClanDropdown2(){ document.getElementById('clanDropdown2').classList.add('open'); renderClanDropdown2(); }
function closeClanDropdown2(){ document.getElementById('clanDropdown2').classList.remove('open'); }
function renderClanDropdown2(){
  const q=document.getElementById('clanSearch2').value.toLowerCase();
  const allClans=[...new Set(entries.map(e=>e.clan))].filter(c=>!selectedGraphClans2.includes(c)&&(!q||c.toLowerCase().includes(q))).sort();
  const dd=document.getElementById('clanDropdown2');
  if(!allClans.length){dd.innerHTML='<div class="clan-opt" style="color:var(--muted)">見つかりません</div>';return;}
  dd.innerHTML=allClans.slice(0,30).map(c=>`<div class="clan-opt" onclick="addGraphClan2('${esc(c)}')">${esc(c)}</div>`).join('');
}
function addGraphClan2(clan){
  const txt=document.createElement('textarea');txt.innerHTML=clan;const name=txt.value;
  if(!selectedGraphClans2.includes(name)) selectedGraphClans2.push(name);
  document.getElementById('clanSearch2').value=''; closeClanDropdown2(); renderSelectedClans2(); updateCompareTable();
}
function removeGraphClan2(clan){ selectedGraphClans2=selectedGraphClans2.filter(c=>c!==clan); renderSelectedClans2(); updateCompareTable(); }
function renderSelectedClans2(){
  document.getElementById('selectedClans2').innerHTML=selectedGraphClans2.map((c,i)=>{
    const col=CLAN_COLORS[i%CLAN_COLORS.length];
    return `<span class="clan-tag" style="color:${col};border-color:${col};background:${col}20;">${esc(c)}<button class="clan-tag-del" style="color:${col};" onclick="removeGraphClan2('${esc(c)}')">×</button></span>`;
  }).join('');
}
function updateCompareTable(){
  const wrap=document.getElementById('compareTable');
  if(selectedGraphClans2.length===0){wrap.innerHTML='<div class="no-graph">クランを選択してください</div>';return;}
  const allDates=[...new Set(entries.map(e=>e.date))].sort((a,b)=>b.localeCompare(a));
  const days=['日','月','火','水','木','金','土'];
  const bosses={'0':'鎌の魔道士','1':'墓守り','2':'ファイアドラゴン','3':'バルログ','4':'メドゥーサ','5':'ストーンマン','6':'一つ目の魔道士'};
  let html='<div style="overflow-x:auto;"><table class="compare-table"><thead><tr><th style="text-align:left;">日付</th>';
  selectedGraphClans2.forEach((c,i)=>{
    const col=CLAN_COLORS[i%CLAN_COLORS.length];
    html+=`<th class="clan-th" style="color:${col};">${esc(c)}</th>`;
  });
  html+='</tr></thead><tbody>';
  allDates.forEach(date=>{
    const[y,m,d]=date.split('-');
    const dow=new Date(+y,+m-1,+d).getDay();
    const boss=bosses[String(dow)];
    const dayLabel=`${+m}/${+d}(${days[dow]})<br><span style="font-size:9px;opacity:0.6;">${boss}</span>`;
    const scores=selectedGraphClans2.map(c=>{
      const allNames=getClanNames(c);
      const rec=entries.find(e=>e.date===date&&allNames.includes(e.clan));
      return rec?rec.score:null;
    });
    if(scores.every(s=>s===null)) return;
    const valid=scores.map((s,i)=>({s,i})).filter(x=>x.s!==null).sort((a,b)=>b.s-a.s);
    const rankMap={};
    valid.forEach((x,ri)=>rankMap[x.i]=ri+1);
    const winnerIdx=valid.length>0?valid[0].i:-1;
    html+=`<tr><td class="date-td">${dayLabel}</td>`;
    scores.forEach((s,i)=>{
      const rank=rankMap[i];
      const rc=rank===1?'cmp-r1':rank===2?'cmp-r2':rank===3?'cmp-r3':'cmp-rx';
      const winCls=i===winnerIdx?' cmp-winner':'';
      html+=s===null?`<td class="${winCls}"><span class="cmp-none">-</span></td>`:`<td class="${winCls}"><div class="cmp-rank ${rc}">${rank}</div><div class="cmp-score">${formatScore(s)}</div></td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  wrap.innerHTML=html;
}

function renderBossTable(dates,labels){
  const wrap=document.getElementById('bossTable');
  if(!selectedBoss||selectedGraphClans.length===0){wrap.innerHTML='';return;}
  const days=['日','月','火','水','木','金','土'];
  let html='<table class="compare-table"><thead><tr><th style="text-align:left;">日付</th>';
  selectedGraphClans.forEach((c,i)=>{
    const col=CLAN_COLORS[i%CLAN_COLORS.length];
    html+=`<th style="color:${col};text-align:right;">${esc(c)}</th>`;
  });
  html+='</tr></thead><tbody>';
  dates.forEach((date,di)=>{
    const[y,m,d]=date.split('-');
    const dow=new Date(+y,+m-1,+d).getDay();
    const scores=selectedGraphClans.map(c=>{
      const allNames=getClanNames(c);
      const rec=entries.find(e=>e.date===date&&allNames.includes(e.clan));
      return rec?rec.score:null;
    });
    const valid=scores.map((s,i)=>({s,i})).filter(x=>x.s!==null).sort((a,b)=>b.s-a.s);
    const rankMap={};
    valid.forEach((x,ri)=>rankMap[x.i]=ri+1);
    html+=`<tr><td class="date-td">${labels[di]}<br><span style="font-size:9px;opacity:0.6;">${days[dow]}</span></td>`;
    scores.forEach((s,i)=>{
      const rank=rankMap[i];
      const rc=rank===1?'cmp-r1':rank===2?'cmp-r2':rank===3?'cmp-r3':'cmp-rx';
      html+=s===null?`<td style="text-align:right;"><span class="cmp-none">-</span></td>`:`<td style="text-align:right;"><div class="cmp-rank ${rc}" style="float:left;">${rank}</div><div class="cmp-score">${formatScore(s)}</div></td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  wrap.innerHTML=html;
}

function updateChart(){
  const noGraph=document.getElementById('noGraph');
  if(!selectedBoss||selectedGraphClans.length===0){
    noGraph.style.display='block';
    if(myChart){myChart.destroy();myChart=null;}
    document.getElementById('bossTable').innerHTML='';
    return;
  }
  const dates=getBossDates(selectedBoss);
  if(!dates.length){noGraph.textContent='該当日付がありません';noGraph.style.display='block';return;}
  noGraph.style.display='none';
  const datasets=selectedGraphClans.map((clan,i)=>{
    const color=CLAN_COLORS[i%CLAN_COLORS.length];
    const data=dates.map(d=>{
      const rec=entries.find(e=>e.date===d&&e.clan===clan);
      return rec?rec.score/1e12:null;
    });
    return{label:clan,data,borderColor:color,backgroundColor:color+'30',pointBackgroundColor:color,pointRadius:5,pointHoverRadius:7,tension:0.3,spanGaps:false};
  });
  const labels=dates.map(d=>{const[y,m,dd]=d.split('-');return `${+m}/${+dd}`;});
  if(myChart){myChart.destroy();}
  renderBossTable(dates,labels);
  myChart=new Chart(document.getElementById('myChart'),{
    type:'line',data:{labels,datasets},
    options:{
      responsive:true,interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:'#e8dcc8',font:{size:11},boxWidth:16}},
        title:{display:true,text:selectedBoss+'（'+['日','月','火','水','木','金','土'][new Date(...dates[0].split('-').map((v,i)=>i===1?+v-1:+v)).getDay()]+'曜日）',color:'#f0c040',font:{size:13}},
        tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.parsed.y!==null?ctx.parsed.y.toFixed(2)+'T':'データなし'}`}}
      },
      scales:{
        x:{ticks:{color:'#6a7080'},grid:{color:'#222840'}},
        y:{ticks:{color:'#6a7080',callback:v=>v+'T'},grid:{color:'#222840'},title:{display:true,text:'スコア (T)',color:'#6a7080'}}
      }
    }
  });
}
</script>
<script>
// ===== プッシュ通知 =====
// ↓ Cloudflare Worker をデプロイしたら、その URL をここに設定してください（末尾スラッシュなし）
const PUSH_CONFIG = {
  workerUrl: 'https://monster-push.t-a-112358.workers.dev',
  vapidPublicKey: 'BIg_g551l8PAayLBanmfP2NkeHjp0YTtdQaLmpAAIgQkx5dBeyvNxrwcNnyNG3QHwdfEuH0O9kHufJtw3uVMwek'
};

let swReg = null;

function urlB64ToUint8Array(base64){
  const padding = '='.repeat((4 - base64.length % 4) % 4);
  const b64 = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(b64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

function pushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window &&
         'Notification' in window && !!PUSH_CONFIG.workerUrl;
}
// ボタン自体は workerUrl があれば表示する（iOS Safari でも見えるように）。
// 実際に使えるかは toggleNotif() 側で判定して案内する。
function notifBtnVisible(){
  return 'serviceWorker' in navigator && !!PUSH_CONFIG.workerUrl;
}

function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isStandalone(){
  return window.navigator.standalone === true ||
         window.matchMedia('(display-mode: standalone)').matches;
}

async function refreshNotifBtn(){
  const btn = document.getElementById('notifBtn');
  if(!btn) return;
  if(!notifBtnVisible()){ btn.style.display = 'none'; return; }
  btn.style.display = '';
  let sub = null;
  try { sub = swReg && await swReg.pushManager.getSubscription(); } catch(_){}
  if(sub && 'Notification' in window && Notification.permission === 'granted'){
    btn.textContent = '🔔 通知ON';
    btn.style.borderColor = 'var(--gold)';
    btn.style.color = 'var(--gold)';
    btn.style.background = 'rgba(240,192,64,0.1)';
  } else {
    btn.textContent = '🔔 更新通知';
    btn.style.borderColor = 'var(--gold2)';
    btn.style.color = 'var(--gold)';
    btn.style.background = 'rgba(240,192,64,0.06)';
  }
}

async function toggleNotif(){
  if(!PUSH_CONFIG.workerUrl){ alert('この環境ではプッシュ通知を利用できません'); return; }
  // iPhone/iPad はホーム画面に追加したアイコンから開かないと通知を受け取れない
  if(isIOS() && !isStandalone()){
    alert('iPhone・iPadで通知を受け取るには「ホーム画面に追加」が必要です。\n\n①画面下の共有ボタン（□に↑）をタップ\n②「ホーム画面に追加」を選ぶ\n③追加されたアイコンから開く\n④もう一度この「🔔 更新通知」をタップ\n\n※iOS 16.4以降が必要です');
    return;
  }
  if(!pushSupported()){ alert('この環境ではプッシュ通知を利用できません（ブラウザが未対応です）'); return; }
  const btn = document.getElementById('notifBtn');
  // SW がまだ準備中なら、ここで起動完了を待つ
  if(!swReg){
    btn.textContent = '⏳ 準備中...';
    try { swReg = await navigator.serviceWorker.ready; }
    catch(_){ alert('通知の準備に失敗しました。アプリを開き直して再度お試しください'); await refreshNotifBtn(); return; }
  }
  try {
    let sub = await swReg.pushManager.getSubscription();
    if(sub && Notification.permission === 'granted'){
      // 解除
      await fetch(PUSH_CONFIG.workerUrl + '/unsubscribe', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ endpoint: sub.endpoint })
      }).catch(()=>{});
      await sub.unsubscribe();
      await refreshNotifBtn();
      return;
    }
    btn.textContent = '⏳ 設定中...';
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ alert('通知が許可されませんでした。ブラウザ/端末の設定から許可してください'); await refreshNotifBtn(); return; }
    if(!sub){
      sub = await swReg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlB64ToUint8Array(PUSH_CONFIG.vapidPublicKey)
      });
    }
    const res = await fetch(PUSH_CONFIG.workerUrl + '/subscribe', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(sub)
    });
    if(!res.ok) throw new Error('subscribe failed: ' + res.status);
    await refreshNotifBtn();
    alert('更新通知をオンにしました。ランキング更新時にお知らせします。');
  } catch(e){
    console.warn('通知設定エラー:', e);
    alert('通知の設定に失敗しました: ' + e.message);
    await refreshNotifBtn();
  }
}

// ボタンの表示は SW の準備を待たずに即実行（iOSでSWのreadyが遅い/来ない場合の対策）
refreshNotifBtn();
if('serviceWorker' in navigator){
  // 新しいSWが制御を握ったら自動リロードして最新のindex.htmlを反映する
  // (初回インストール時はcontrollerが無いのでリロードしない)
  const hadController = !!navigator.serviceWorker.controller;
  let swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(hadController && !swReloaded){ swReloaded = true; location.reload(); }
  });
  navigator.serviceWorker.register('./service-worker.js')
    .then(reg => { swReg = reg; refreshNotifBtn(); return navigator.serviceWorker.ready; })
    .then(reg => { swReg = reg; refreshNotifBtn(); })
    .catch(e => console.warn('SW登録失敗:', e));
}
</script>
