name: Push notification on update

# data.json が更新（main へ push）されたら、購読者へプッシュ通知を送る
on:
  push:
    branches: [main]
    paths:
      - 'data.json'
  workflow_dispatch: {}  # 手動テスト用

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build notification payload
        run: node .github/scripts/build-message.js

      - name: Send push via Cloudflare Worker
        env:
          # Worker の URL は公開情報なので直書き（守るべきは NOTIFY_SECRET の方）
          WORKER_URL: "https://monster-push.t-a-112358.workers.dev"
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          # secret に混入しがちな空白・改行を除去
          NOTIFY_SECRET="$(printf '%s' "$NOTIFY_SECRET" | tr -d '[:space:]')"
          if [ -z "$NOTIFY_SECRET" ]; then
            echo "NOTIFY_SECRET secret が未設定です。スキップします。"
            exit 0
          fi
          HTTP_CODE="$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST "$WORKER_URL/notify" \
            -H "Authorization: Bearer $NOTIFY_SECRET" \
            -H "Content-Type: application/json" \
            --data @payload.json)"
          echo "HTTP $HTTP_CODE"
          RESP="$(cat /tmp/resp.txt)"
          echo "Worker response: $RESP"
          if [ "$HTTP_CODE" -ge 400 ] || [ -z "$HTTP_CODE" ]; then
            echo "通知の送信に失敗しました。"
            {
              echo "## 🔔 通知送信結果"
              echo ""
              echo "❌ 送信に失敗しました（HTTP $HTTP_CODE）。"
              echo ""
              echo '```'
              echo "$RESP"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "通知を送信しました。"

          # Worker のレスポンス（{ ok, total, sent, removed }）を実行サマリに表示
          TOTAL="$(printf '%s' "$RESP" | grep -o '"total":[0-9]*' | grep -o '[0-9]*' || true)"
          SENT="$(printf '%s' "$RESP" | grep -o '"sent":[0-9]*' | grep -o '[0-9]*' || true)"
          REMOVED="$(printf '%s' "$RESP" | grep -o '"removed":[0-9]*' | grep -o '[0-9]*' || true)"
          {
            echo "## 🔔 通知送信結果"
            echo ""
            echo "**${SENT:-?} 人**に通知を送信しました。"
            echo ""
            echo "| 項目 | 件数 |"
            echo "|---|---|"
            echo "| 送信成功（受信した人数） | ${SENT:-?} |"
            echo "| 購読総数 | ${TOTAL:-?} |"
            echo "| 無効として削除 | ${REMOVED:-?} |"
          } >> "$GITHUB_STEP_SUMMARY"
